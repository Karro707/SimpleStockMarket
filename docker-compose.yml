services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api1:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - INSTANCE_ID=api1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api2:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - INSTANCE_ID=api2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api3:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - INSTANCE_ID=api3
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped